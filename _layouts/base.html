<!DOCTYPE html>
<!--[if lt IE 7]> <html class="no-js ie6 oldie" lang="en"> <![endif]-->
<!--[if IE 7]>    <html class="no-js ie7 oldie" lang="en"> <![endif]-->
<!--[if IE 8]>    <html class="no-js ie8 oldie" lang="en"> <![endif]-->
<!--[if gt IE 8]><!--> <html class="no-js" lang="en"> <!--<![endif]-->
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>{% if title %}{{ title }} - {% endif %}{{ site.title }}</title>
    <meta name="description" content="" />
    {% if keywords %}<meta name="keywords" content="{{ keywords }}">{% endif %}
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <!-- Facebook stuff -->
    {% if ogtitle %}<meta property="og:title" content="{{ ogtitle }}" />{% endif %}
    {% if ogdesc %}<meta property="og:description" content="{{ ogdesc }}" />{% endif %}
    <meta property="og:image" content="{{ site.url }}/assets/img/icon.png" />
    <meta property="og:site_name" content="{{ site.title }}" />
    {% if ogtype %}<meta property="og:type" content="{{ ogtype }}" />{% endif %}
    {% if ogtitle %}<meta property="og:url" content="{{ site.url }}{{ page.url }}" />{% endif %}
    {% if ogtitle %}<meta property="fb:admins" content="678400723" />{% endif %}

    <link rel="stylesheet" href="/assets/css/styles.css" />
    {% if styles %}<link rel="stylesheet" href="{{ styles }}" />{% endif %}
    <link href="{{ site.subscribe_rss }}" rel="alternate" title="{{ site.title }}" type="application/atom+xml" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    <link rel="author" href="/humans.txt" />

    <link rel="shortcut icon" href="/assets/img/icon.png" />
    <link rel="canonical" href="{{ site.url }}{% if page.url %}{{ page.url }}{% endif %}" />
  </head>
  <body {% if body_class %}class="{{ body_class }}"{% endif %}>
    <div id="container">
      <header id="banner">
        {% include "header.html" %}
      </header>
      <div id="main" role="main">
        {{ content }}
      </div>
      <footer id="colophon">
        {% include "footer.html" %}
      </footer>
    </div> <!--! end of #container -->

    <!--[if lt IE 7 ]>
      <script src="//ajax.googleapis.com/ajax/libs/chrome-frame/1.0.3/CFInstall.min.js"></script>
      <script>window.attachEvent('onload',function(){CFInstall.check({mode:'overlay'})})</script>
    <![endif]-->
  </body>
</html>
