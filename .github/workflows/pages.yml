# Builds the Eleventy site and publishes it to GitHub Pages as a mirror at
# bryanjswift.github.io. Vercel is the real host; canonical links in the
# generated pages point there (see `site.url` in _data/site.js).
#
# Requires Settings → Pages → Source to be "GitHub Actions". With "Deploy from
# a branch", GitHub runs its own Jekyll build instead, which fails on this repo.
name: Deploy GitHub Pages mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Run one deployment at a time, but let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Reads the `volta` pin in package.json.
          node-version-file: package.json
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
